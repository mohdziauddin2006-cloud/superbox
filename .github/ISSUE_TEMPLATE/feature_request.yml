name: Feature request
description: Suggest a section, source, interaction or polish pass.
title: "[idea] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Windows
        - Both
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the moment where SuperBox feels incomplete.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should it do, and how should it feel?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — existing apps, workarounds or other approaches.
