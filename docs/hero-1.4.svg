  </g>
  <text x="800" y="330" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="300" font-weight="700" fill="#ffc105" opacity="0.04" letter-spacing="10">&#8734;</text>
  <g filter="url(#halo)" opacity="0.55">
    <path d="M800 208 C700 96 540 128 540 208 C540 288 700 320 800 208 C900 96 1060 128 1060 208 C1060 288 900 320 800 208" fill="none" stroke="#ffc105" stroke-width="10" stroke-linecap="round"/>
  </g>
  <path d="M800 208 C700 96 540 128 540 208 C540 288 700 320 800 208 C900 96 1060 128 1060 208 C1060 288 900 320 800 208" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" filter="url(#soft)"/>
  <circle cx="800" cy="208" r="4" fill="#fff8dc" opacity="0.9"/>
