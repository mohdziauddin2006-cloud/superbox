<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-label="SuperBox 1.4.0 — one box, infinite library">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050508"/>
      <stop offset="0.5" stop-color="#0b0b10"/>
      <stop offset="1" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.58">
      <stop offset="0" stop-color="#ffc105" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffc105" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffc105" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.3" stop-color="#ffc105"/>
      <stop offset="0.68" stop-color="#c98a00"/>
      <stop offset="1" stop-color="#ffe9a3"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="halo" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#dots)"/>
  <rect width="1600" height="560" fill="url(#glow)"/>
  <g opacity="0.05" stroke="#ffc105" fill="none" stroke-width="1">
