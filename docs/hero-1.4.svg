  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="4" fill="#8f8b80" text-anchor="middle">
    <text x="800" y="516">V1.4.0 &#183; OFFLINE ONNX AI &#183; EMBEDDED VPN &#183; ZERO ADS</text>
