<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SuperBox</title>
<script>
window.__SB_TOKEN__ = "__SB_TOKEN_VALUE__";
(function () {
  var raw = window.fetch ? window.fetch.bind(window) : null;
  if (!raw) return;
  var guarded = /^\/(?:api\/|page(?:\?|$)|extract(?:\?|$)|tmdb\/|img(?:\?|$)|stream(?:\?|$)|hls(?:\?|$)|hlsseg(?:\?|$)|dash(?:\?|$)|dashseg(?:\?|$))/;
  function sign(u) {
    var abs, clean = u.split("#")[0];
    try { abs = new URL(clean, location.href); } catch (e) { return u; }
    if (abs.origin !== location.origin) return u;
    if (!guarded.test(abs.pathname + abs.search)) return u;
    if (/[?&]t=/.test(clean)) return u;
    return clean + (clean.indexOf("?") >= 0 ? "&" : "?") + "t=" + encodeURIComponent(window.__SB_TOKEN__);
  }
  window.fetch = function (input, init) {
    try {
      var u = typeof input === "string" ? input : ((input && input.url) || "");
      var next = u ? sign(u) : u;
      if (next !== u) {
        if (typeof input === "string") input = next;
        else if (window.Request) input = new Request(next, input);
      }
    } catch (e) {}
    return raw(input, init);
  };
})();
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot-mark">S</div>
  <div class="boot-word">SUPER<span>BOX</span></div>
  <div class="boot-line"><i></i></div>
  <div class="boot-sub">Infinite library · One box</div>
</div>

<div id="app" class="app">
  <header id="topbar" class="topbar">
    <button id="brand" class="brand" aria-label="SuperBox home">
      <span class="brand-mark">S</span>
      <span class="brand-word">SUPER<span>BOX</span></span>
    </button>
    <div class="top-actions">
      <button id="searchBtn" class="icon-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path></svg>
      </button>
      <button id="meBtn" class="avatar-btn" aria-label="Profile">S</button>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav id="tabbar" class="tabbar" aria-label="Main navigation">
    <button class="tab active" data-tab="home" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.7 12 3l9 7.7"></path><path d="M5.5 9.5V21h13V9.5"></path><path d="M9.5 21v-6h5v6"></path></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-tab="movies" aria-label="Movies">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M7 5v14M17 5v14M3 9h4M3 15h4M17 9h4M17 15h4"></path></svg>
      <span>Movies</span>
    </button>
    <button class="tab" data-tab="series" aria-label="Series">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="19" height="13" rx="2.5"></rect><path d="m8 3 4 4 4-4"></path><path d="M8 12h8M8 16h5"></path></svg>
      <span>Series</span>
    </button>
    <button class="tab" data-tab="anime" aria-label="Anime">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z"></path><path d="M19 16.5 20 19l2.5 1-2.5 1-1 2.5-1-2.5L15.5 20l2.5-1 1-2.5Z"></path></svg>
      <span>Anime</span>
    </button>
    <button class="tab" data-tab="me" aria-label="Me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 21c.7-4 3.5-6.2 7.5-6.2s6.8 2.2 7.5 6.2"></path></svg>
      <span>Me</span>
    </button>
  </nav>
</div>

<div id="detail" class="detail hidden" aria-hidden="true"></div>

<div id="searchPage" class="search-page hidden" aria-hidden="true">
  <div class="search-head">
    <button id="searchBack" class="icon-btn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    </button>
    <div class="search-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path></svg>
      <input id="searchInput" type="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Search movies, series, anime...">
      <button id="searchClear" class="search-clear hidden" aria-label="Clear search">×</button>
    </div>
  </div>
  <div class="search-body">
    <div id="searchHint" class="search-hint"></div>
    <div id="searchResults" class="grid search-grid"></div>
  </div>
</div>

<div id="player" class="player hidden" aria-hidden="true">
  <div class="player-stage">
    <video id="video" playsinline webkit-playsinline preload="metadata"></video>
    <div id="pTap" class="p-tap" aria-label="Toggle player controls"></div>
    <div id="pUi" class="p-ui">
      <div class="p-top">
        <button id="pBack" class="p-icon" aria-label="Close player">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
        <div class="p-meta">
          <strong id="pTitle">SuperBox</strong>
          <span id="pSub"></span>
        </div>
        <button id="pMore" class="p-icon" aria-label="Player options">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
        </button>
      </div>

      <div class="p-center">
        <button id="pPlay" class="p-big" aria-label="Play or pause">
          <svg id="pPlayIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10-6.5-10-6.5Z"></path></svg>
        </button>
        <div id="pSpinner" class="p-spinner hidden"><i></i></div>
      </div>

      <div class="p-bottom">
        <div class="p-times"><span id="pCur">0:00</span><span id="pDur">0:00</span></div>
        <input id="pSeek" class="p-seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
        <div class="p-buttons">
          <button id="pRew" class="p-small" aria-label="Rewind 10 seconds"><span class="p-sym">−10</span><em>Back</em></button>
          <button id="pFwd" class="p-small" aria-label="Forward 10 seconds"><span class="p-sym">+10</span><em>Forward</em></button>
          <button id="pQuality" class="p-small" aria-label="Quality"><span class="p-sym" id="pQualityLabel">Auto</span><em>Quality</em></button>
          <button id="pAudio" class="p-small" aria-label="Audio"><span class="p-sym">Audio</span><em id="pAudioLabel">Original</em></button>
          <button id="pEps" class="p-small hidden" aria-label="Episodes"><span class="p-sym">Ep</span><em>Episodes</em></button>
          <button id="pSpeed" class="p-small" aria-label="Playback speed"><span class="p-sym" id="pSpeedLabel">1x</span><em>Speed</em></button>
          <button id="pRotate" class="p-small" aria-label="Rotate screen"><span class="p-sym">↻</span><em>Rotate</em></button>
        </div>
      </div>
    </div>

    <div id="pError" class="p-error hidden">
      <div class="p-error-card">
        <div class="p-error-icon">!</div>
        <h3>Stream unavailable</h3>
        <p id="pErrorText">This stream could not be started.</p>
        <div class="p-error-actions">
          <button id="pRetry" class="btn-primary">Try again</button>
          <button id="pErrorBack" class="btn-ghost">Back</button>
        </div>
      </div>
    </div>
    <div id="pGesture" class="p-gesture"></div>
  </div>
</div>

<div id="sheet" class="sheet hidden" aria-hidden="true">
  <div id="sheetBackdrop" class="sheet-backdrop"></div>
  <div class="sheet-panel">
    <div class="sheet-grab"></div>
    <div id="sheetContent"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/sources.js"></script>
<script src="/libraries.js"></script>
<script src="/app.js"></script>
<script src="/library.js"></script>
</body>
</html>
